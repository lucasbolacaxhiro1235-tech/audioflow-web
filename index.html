<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioFlow | Spotify to Local</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0-3.6 17.24c.45.08.62-.19.62-.43v-1.5c-2.52.55-3.05-1.22-3.05-1.22-.41-1.05-1-1.33-1-1.33-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.38 2.11.98 2.63.75.08-.58.31-.98.57-1.2-2-.23-4.1-1-4.1-4.45 0-.98.35-1.79.93-2.42-.1-.23-.4-1.15.08-2.39 0 0 .76-.24 2.48.93a8.6 8.6 0 0 1 4.52 0c1.72-1.17 2.48-.93 2.48-.93.49 1.24.18 2.16.09 2.39.58.63.92 1.44.92 2.42 0 3.45-2.1 4.22-4.1 4.45.32.28.61.82.61 1.66v2.46c0 .24.16.52.62.43A9 9 0 0 0 12 3z"/></svg>
                </div>
                <span class="brand-name">Audio<span>Flow</span></span>
            </div>
            <div class="status-pill" id="status-dot">
                <span class="dot"></span>
                <span class="status-text">Pronto</span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="hero">
            <h1 class="hero-title">Sua música, <br><span>sem limites.</span></h1>
            <p class="hero-subtitle">Converta suas playlists, álbuns ou faixas do Spotify para áudio local com a máxima qualidade.</p>
        </section>

        <div class="glass-container">
            <!-- Busca -->
            <div class="search-section">
                <div class="input-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input id="url-input" type="url" placeholder="Cole o link do Spotify aqui..." autocomplete="off">
                        <button id="clear-btn" class="clear-btn" hidden>✕</button>
                    </div>
                    <button id="download-btn" class="btn-primary">
                        <span>Baixar</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5M12 15V3"/></svg>
                    </button>
                </div>
                <div id="meta-line" class="meta-info">Aguardando link...</div>
            </div>

            <!-- Configurações -->
            <div class="settings-grid">
                <div class="setting-card">
                    <label>Formato</label>
                    <select id="format">
                        <option value="mp3">MP3</option>
                        <option value="m4a">M4A</option>
                        <option value="opus">Opus</option>
                        <option value="flac">FLAC</option>
                        <option value="wav">WAV</option>
                    </select>
                </div>
                <div class="setting-card">
                    <label>Qualidade</label>
                    <select id="quality">
                        <option value="128">128 kbps</option>
                        <option value="192" selected>192 kbps</option>
                        <option value="256">256 kbps</option>
                        <option value="320">320 kbps</option>
                    </select>
                </div>
                <div class="setting-card full-width">
                    <label>Pasta de Destino</label>
                    <div class="folder-input-wrap">
                        <input id="folder" type="text" readonly placeholder="Selecione a pasta...">
                        <button id="folder-btn" class="btn-secondary">Escolher</button>
                    </div>
                </div>
            </div>

            <!-- Opções Adicionais -->
            <div class="options-row">
                <label class="toggle-switch">
                    <input type="checkbox" id="tracknum">
                    <span class="slider"></span>
                    <span class="label-text">Numerar arquivos</span>
                </label>
                <label class="toggle-switch">
                    <input type="checkbox" id="wm-enabled">
                    <span class="slider"></span>
                    <span class="label-text">Assinatura de Áudio</span>
                </label>
            </div>

            <!-- Watermark Panel -->
            <div id="wm-options" class="watermark-panel hidden">
                <div class="wm-grid">
                    <div class="wm-field">
                        <label>Texto</label>
                        <input id="wm-text" type="text" value="LJCD">
                    </div>
                    <div class="wm-field">
                        <label>Posição</label>
                        <select id="wm-position">
                            <option value="start">Início</option>
                            <option value="middle" selected>Meio</option>
                            <option value="end">Final</option>
                        </select>
                    </div>
                    <div class="wm-field">
                        <label>Volume: <span id="wm-volume-label">30%</span></label>
                        <input id="wm-volume" type="range" min="0" max="100" value="30">
                    </div>
                </div>
                <div class="wm-effects">
                    <label class="chip"><input type="checkbox" id="wm-effect-echo"><span>Eco</span></label>
                    <label class="chip"><input type="checkbox" id="wm-effect-reverb"><span>Reverb</span></label>
                    <label class="chip"><input type="checkbox" id="wm-effect-deep"><span>Voz Grave</span></label>
                    <label class="chip"><input type="checkbox" id="wm-effect-radio"><span>Rádio</span></label>
                </div>
            </div>

            <!-- Progresso -->
            <div class="progress-section">
                <div class="progress-container">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div class="progress-details">
                    <span id="progress-label">Pronto para iniciar</span>
                    <button id="stop-btn" class="btn-stop" disabled>Parar</button>
                </div>
            </div>

            <!-- Lista de Faixas -->
            <div class="tracks-section">
                <div class="section-header">
                    <h3>Músicas</h3>
                    <span id="count-badge" class="badge hidden">0</span>
                </div>
                <div id="track-list" class="track-list">
                    <div id="track-empty" class="empty-state">Nenhuma música na fila.</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>AudioFlow v1.0 &bull; Desenvolvido por Lucas</p>
    </footer>

    <div id="toast-wrap" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
